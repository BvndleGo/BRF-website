<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bvndle Passport</title>
  <meta name="description" content="Your Bvndle digital passport: scan activity QR codes, earn coins, collect them at the reward desk.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    :root { --bg: #111; --card: #1b1b1b; --line: rgba(243,240,235,.18); --fg: #F3F0EB; --dim: #bdb7af; --pink: #FF3E8E; --purple: #5b4bd6; --yellow: #FFD23F; --green: #69E392; --ink: #111;
            --display: "Anton", Impact, sans-serif; --body: "Inter Tight", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100svh; background: var(--bg); color: var(--fg); font: 500 16px/1.5 var(--body); }
    a { color: inherit; }
    .wrap { width: min(520px, 100% - 32px); margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 0 calc(40px + env(safe-area-inset-bottom)); }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
    .top img { height: 40px; width: auto; display: block; }
    .top .ev { text-align: right; font-size: 13px; color: var(--dim); line-height: 1.3; }
    .top .ev b { display: block; color: var(--fg); font-size: 14px; }
    h1, h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: .01em; line-height: .95; margin: 0; }
    h1 { font-size: clamp(40px, 12vw, 56px); }
    h2 { font-size: 30px; }
    .lede { color: var(--dim); margin: 10px 0 22px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 20px; }
    .field { display: grid; gap: 6px; margin-bottom: 14px; }
    .field label { font-weight: 600; font-size: 14px; }
    .field small { color: var(--dim); font-weight: 400; }
    .input { width: 100%; min-height: 52px; padding: 0 16px; border-radius: 14px; border: 2px solid rgba(243,240,235,.3); background: #000; color: var(--fg); font: 500 17px var(--body); }
    .input:focus { outline: none; border-color: var(--pink); box-shadow: 4px 4px 0 var(--pink); }
    .affix { position: relative; } .affix span { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--dim); } .affix .input { padding-left: 36px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; padding: 0 22px; border-radius: 999px; border: 2px solid var(--ink); background: var(--pink); color: var(--ink); font: 800 17px var(--body); cursor: pointer; box-shadow: 4px 4px 0 var(--fg); text-decoration: none; }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn--ghost { background: transparent; color: var(--fg); border-color: var(--fg); box-shadow: none; }
    .err { color: #ff9a7d; font-weight: 600; font-size: 14px; min-height: 1.3em; margin: 4px 0 10px; }
    .fine { color: var(--dim); font-size: 13px; margin: 14px 0 0; text-align: center; }
    /* passport */
    .pp { position: relative; overflow: hidden; border-radius: 24px; background: var(--purple); color: #fff; padding: 22px; border: 2px solid #fff; box-shadow: 6px 6px 0 var(--pink); }
    .pp__row { display: flex; justify-content: space-between; gap: 10px; font: 800 11px/1.2 var(--body); letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
    .pp__cit { font-family: var(--display); font-size: clamp(34px, 10vw, 44px); line-height: .95; text-transform: uppercase; margin: 18px 0 4px; }
    .pp__name { font-size: 20px; font-weight: 800; margin: 0; }
    .pp__meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; opacity: .85; margin-top: 4px; }
    .pp__coins { display: flex; align-items: baseline; gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 2px dashed rgba(255,255,255,.4); }
    .pp__coins b { font-family: var(--display); font-size: 56px; line-height: 1; color: var(--yellow); }
    .pp__glow { position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(255,62,142,.7), transparent 70%); }
    .status { margin: 14px 0 0; padding: 12px 14px; border-radius: 14px; background: rgba(243,240,235,.06); font-size: 14px; }
    .status b { color: var(--yellow); }
    .stamps { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 8px; }
    .stamps li { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); }
    .stamps li i { font-size: 22px; color: var(--dim); }
    .stamps li.is-done { border-color: rgba(105,227,146,.5); background: rgba(105,227,146,.08); }
    .stamps li.is-done i { color: var(--green); }
    .stamps li.is-miss i { color: #ff9a7d; }
    .stamps small { color: var(--dim); }
    .stamps .c { font-weight: 800; white-space: nowrap; }
    .h3 { font-weight: 800; font-size: 15px; margin: 22px 0 0; }
    /* activity */
    .act__coins { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 999px; background: var(--yellow); color: var(--ink); font-weight: 800; font-size: 14px; margin-bottom: 12px; }
    .opts { display: grid; gap: 10px; margin-top: 16px; }
    .opt { text-align: left; min-height: 56px; padding: 12px 16px; border-radius: 16px; border: 2px solid rgba(243,240,235,.35); background: transparent; color: var(--fg); font: 700 17px/1.3 var(--body); cursor: pointer; }
    .opt.is-right { border-color: var(--green); background: rgba(105,227,146,.15); }
    .opt.is-wrong { border-color: #ff7a6e; background: rgba(255,122,110,.12); }
    .slots { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 18px 0; min-height: 56px; }
    .slot { width: 46px; height: 54px; border-radius: 12px; border: 2px dashed rgba(243,240,235,.35); display: grid; place-items: center; font: 400 28px var(--display); }
    .slot.is-fill { border-style: solid; border-color: var(--yellow); color: var(--yellow); }
    .tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .tile { width: 54px; height: 60px; border-radius: 14px; border: 2px solid var(--ink); background: var(--yellow); color: var(--ink); font: 400 30px var(--display); cursor: pointer; box-shadow: 3px 3px 0 var(--fg); }
    .tile:disabled { opacity: .2; box-shadow: none; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .pin { text-align: center; letter-spacing: .4em; font-size: 28px; font-weight: 800; }
    .result { text-align: center; padding: 10px 0 4px; }
    .result .big { font-family: var(--display); font-size: 72px; line-height: 1; color: var(--yellow); }
    .result i.ph-bold { font-size: 56px; }
    .center { text-align: center; }
    .spin { display: grid; place-items: center; min-height: 50svh; color: var(--dim); }
    #fx { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    @media (prefers-reduced-motion: reduce) { #fx { display: none; } }
  </style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <main class="wrap">
    <header class="top"><img src="assets/logo-white.svg?v=2" alt="Bvndle Rewards Festival"><div class="ev" id="evName"></div></header>
    <div id="app" aria-live="polite"><div class="spin">Loading...</div></div>
  </main>
  <script src="js/store.js?v=9"></script>
  <script src="js/passport.js?v=1"></script>
</body>
</html>
