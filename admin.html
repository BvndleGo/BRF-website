  <!-- match the landing page: charcoal #111, never pure black -->
  <style>:root { --night: #111; } body { background: #111; } .nav__logo img { filter: none; }
    .admin-tiles--4 { grid-template-columns: 1.4fr 1fr 1fr 1fr; }
    .admin-bar--split { display: flex; gap: 12px; flex-wrap: wrap; } .admin-bar--split .affix { flex: 1 1 320px; } .admin-bar--split select { flex: 0 0 auto; width: auto; }
    .admin-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; }
    .admin-tabs button { font: 600 15px/1 var(--font-body, inherit); padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(243,240,235,.25); background: transparent; color: inherit; cursor: pointer; }

    .cstatus { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .cstatus--pending { background: rgba(255,210,63,.18); color: #FFD23F; }
    .cstatus--approved { background: rgba(123,224,166,.16); color: #7be0a6; }
    .cstatus--rejected { background: rgba(255,122,110,.16); color: #ff7a6e; }
    .cstatus--collected { background: rgba(139,128,249,.2); color: #b7afff; }
    .admin-tabs--sub { margin: 0; }
    .admin-tabs--sub button { padding: 8px 14px; font-size: 14px; }
    .atile small { display: block; margin-top: 6px; font-size: 13px; opacity: .7; }
    #coinWrap td b { font-weight: 700; }
    #coinWrap td.code { white-space: nowrap; }
    .rwdcell { white-space: nowrap; } .rwdcell .cstatus { margin-left: 6px; } .rwd b { font-weight: 800; }
    .pmore td { background: rgba(243,240,235,.04); }
    .pdl { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 24px; margin: 0; }
    .pdl dt { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; opacity: .65; margin-bottom: 4px; }
    .pdl dd { margin: 0; white-space: pre-wrap; }
    .pnote { min-height: 64px; padding: 10px 12px; }
    .input--sm { min-height: 40px; padding: 0 10px; font-size: 14px; width: auto; }
    #pWrap a { color: inherit; }
    .evnew { border: 1px solid rgba(243,240,235,.16); border-radius: 18px; padding: 18px 20px; margin: 0 0 22px; background: rgba(243,240,235,.03); }
    .evnew h2 { margin: 0 0 12px; font-size: 17px; }
    .evnew__row { display: grid; grid-template-columns: 2fr 2fr 1fr auto; gap: 12px; align-items: end; }
    .evnew__row--5 { grid-template-columns: 1.4fr 1.6fr 1fr 1.1fr auto; }
    .evnew .field { display: grid; gap: 6px; margin: 0; } .evnew .field > span { font-size: 13px; font-weight: 600; }
    .evadd__go { display: flex; gap: 12px; align-items: center; }
    .evcheck { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; white-space: nowrap; }
    .evmsg { margin: 10px 0 0; min-height: 1.2em; font-size: 14px; }
    .evgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .evcard { text-align: left; display: grid; gap: 6px; padding: 18px; border-radius: 18px; border: 1px solid rgba(243,240,235,.18); background: rgba(243,240,235,.04); color: inherit; font: inherit; cursor: pointer; }
    .evcard:hover { border-color: #FF3E8E; } .evcard > b { font-size: 18px; }
    .evcard__stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; } .evcard .cstatus { justify-self: start; }
    .evcoins { display: flex; gap: 6px; align-items: center; } .evcoins .input { width: 96px; }
    .cstatus--none { background: rgba(243,240,235,.08); color: #bdb7af; }
    .evtable td { vertical-align: middle; }
    .evacts { border: 1px solid rgba(243,240,235,.16); border-radius: 18px; padding: 18px 20px; margin: 0 0 22px; }
    .evacts h2 { margin: 0 0 4px; font-size: 17px; } .evacts .muted { margin: 0; font-size: 14px; }
    .evacts__head { display: flex; justify-content: space-between; gap: 14px 24px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 16px; }
    .evacts__live { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .evacts__grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; margin-bottom: 16px; }
    .evpp { display: flex; gap: 16px; align-items: flex-start; padding: 14px; border-radius: 14px; background: rgba(243,240,235,.04); }
    .evpp__qr { flex: none; width: 150px; background: #fff; border-radius: 10px; padding: 4px; } .evpp__qr svg { display: block; width: 100%; height: auto; }
    .evpp__btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .evact { display: grid; gap: 10px; padding: 14px; border-radius: 14px; background: rgba(243,240,235,.04); }
    .evact .field { display: grid; gap: 6px; margin: 0; } .evact .field > span { font-size: 13px; font-weight: 600; }
    .evact__row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }

    .evnew__row--tp { grid-template-columns: 1.4fr 1fr 1.6fr auto; } .evnew__row--tp2 { grid-template-columns: 1.4fr 1.6fr 1fr auto; }
    .tpforms { display: grid; grid-template-columns: 1fr; gap: 0; }
    .tpcard { cursor: default; } .tpcard .tag { font: 500 12px/1.3 ui-monospace, Menlo, monospace; padding: 2px 6px; border-radius: 6px; background: rgba(243,240,235,.1); margin-left: 6px; }
    .tpranges { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; } .tpcard .btn { justify-self: start; }
    #tpList { margin-bottom: 22px; }

    @media (max-width: 1000px) { .evacts__grid { grid-template-columns: 1fr; } }
    @media (max-width: 560px) { .evpp { flex-direction: column; } }

    @media (max-width: 560px) { .evnew__row, .evnew__row--5 { grid-template-columns: 1fr; } }
    @media (max-width: 760px) { #evWrap table, #evWrap tbody, #evWrap tr, #evWrap td { display: block; width: auto; } #evWrap thead { display: none; } #evWrap tr { padding: 12px 14px; border-bottom: 1px solid rgba(243,240,235,.12); } #evWrap td { padding: 4px 0; border: 0; } #evWrap td::before { content: attr(data-l); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .6; } #evWrap td[data-l="Name"]::before { display: none; } #evWrap .linkish { display: inline; width: auto; margin: 0 0 0 10px; } }
    .an-small .atile b { font-size: 34px; }
    .an-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 8px 0 32px; }
    .an-card { padding: 22px 24px; border-radius: var(--r-card, 20px); background: var(--night-2, #1a1a1a); border: 1px solid rgba(243,240,235,.14); min-width: 0; }
    .an-card--wide { grid-column: 1 / -1; }
    .an-card h2, .an-h { font: 700 18px/1.2 var(--font-body, inherit); margin: 0 0 6px; }
    .an-h { margin: 8px 0 14px; }
    .an-card p.muted { font-size: 13px; margin: 0 0 14px; }
    .abar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr auto; gap: 12px; align-items: center; padding: 6px 0; font-size: 14px; }
    .abar__lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .abar__track { height: 10px; border-radius: 99px; background: rgba(243,240,235,.08); overflow: hidden; }
    .abar__track i { display: block; height: 100%; border-radius: 99px; background: #FF3E8E; }
    .abar__n { font-variant-numeric: tabular-nums; color: var(--cloud-dim, #aaa); white-space: nowrap; }
    .an-cols { display: flex; align-items: flex-end; gap: 6px; height: 180px; padding-top: 20px; overflow-x: auto; }
    .an-col { flex: 1 0 28px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
    .an-col i { width: 100%; max-width: 44px; border-radius: 6px 6px 0 0; background: #8B80F9; }
    .an-col__n { font-size: 12px; color: var(--cloud-dim, #aaa); }
    .an-col__lab { font-size: 11px; color: var(--cloud-dim, #aaa); white-space: nowrap; }
    .an-cols--hours .an-col { flex-basis: 18px; }
    .an-did { white-space: normal !important; min-width: 220px; max-width: 360px; }
    @media (max-width: 900px) { .an-grid { grid-template-columns: 1fr; } }
    .checkin.is-in { display: inline-flex; align-items: center; gap: 6px; color: #7be0a6; font-weight: 600; white-space: nowrap; }
    @media (max-width: 700px) { .admin-tiles--4 { grid-template-columns: 1fr 1fr; } }</style>
